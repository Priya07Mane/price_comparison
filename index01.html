<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Price Comparison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                <i class="fas fa-tshirt mr-3 text-pink-500"></i>Fashion Price Comparison
            </h1>
            <p class="text-gray-600 mt-2">Compare prices across top fashion retailers</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <!-- Search Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Search for Products</h2>
            <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label for="productName" class="block text-sm font-medium text-gray-700 mb-1">Product Name *</label>
                    <input type="text" id="productName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., floral mini dress">
                </div>
                <div>
                    <label for="brand" class="block text-sm font-medium text-gray-700 mb-1">Brand (Optional)</label>
                    <input type="text" id="brand" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., Zara">
                </div>
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="category" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="dresses">Dresses</option>
                        <option value="tops">Tops</option>
                        <option value="jeans">Jeans</option>
                        <option value="shoes">Shoes</option>
                        <option value="accessories">Accessories</option>
                    </select>
                </div>
                <div>
                    <label for="color" class="block text-sm font-medium text-gray-700 mb-1">Color (Optional)</label>
                    <input type="text" id="color" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., blue">
                </div>
                <div>
                    <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                    <select id="gender" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="men">Men</option>
                        <option value="women" selected>Women</option>
                        <option value="unisex">Unisex</option>
                    </select>
                </div>
                <div>
                    <label for="maxPrice" class="block text-sm font-medium text-gray-700 mb-1">Max Price (₹) (Optional)</label>
                    <input type="number" id="maxPrice" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., 5000">
                </div>
                <div class="md:col-span-2 lg:col-span-3 flex justify-end mt-4">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md flex items-center">
                        <i class="fas fa-search mr-2"></i> Search
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Search Results</h2>
                <div id="resultCount" class="text-gray-600"></div>
            </div>

            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="hidden py-12">
                <div class="loading-spinner"></div>
                <p class="text-center text-gray-600 mt-4">Searching across stores. This may take a moment...</p>
            </div>

            <!-- Results Grid -->
            <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

            <!-- No Results Message -->
            <div id="noResults" class="hidden text-center py-12">
                <i class="fas fa-search fa-3x text-gray-300 mb-4"></i>
                <h3 class="text-xl font-semibold text-gray-700">No products found</h3>
                <p class="text-gray-500 mt-2">Try adjusting your search criteria</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white mt-12 py-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2023 Fashion Price Comparison. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Get form values
            const filters = {
                name: document.getElementById('productName').value,
                brand: document.getElementById('brand').value || null,
                category: document.getElementById('category').value,
                color: document.getElementById('color').value || null,
                gender: document.getElementById('gender').value,
                max_price: document.getElementById('maxPrice').value ? parseFloat(document.getElementById('maxPrice').value) : null
            };
            
            // Show results section and loading indicator
            document.getElementById('resultsSection').classList.remove('hidden');
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('resultsGrid').innerHTML = '';
            document.getElementById('noResults').classList.add('hidden');
            
            try {
                // Call the backend API - FIXED URL
                const response = await fetch('http://localhost:8000/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(filters)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Search failed');
                }
                
                const results = await response.json();
                
                // Hide loading indicator
                document.getElementById('loadingIndicator').classList.add('hidden');
                
                // Update result count
                document.getElementById('resultCount').textContent = `${results.length} products found`;
                
                if (results.length === 0) {
                    document.getElementById('noResults').classList.remove('hidden');
                    return;
                }
                
                // Display results
                const resultsGrid = document.getElementById('resultsGrid');
                results.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card bg-white rounded-lg shadow-md overflow-hidden';
                    
                    // Format price with Indian Rupee symbol
                    const formattedPrice = new Intl.NumberFormat('en-IN', {
                        style: 'currency',
                        currency: 'INR',
                        maximumFractionDigits: 0
                    }).format(product.price);
                    
                    let originalPriceHtml = '';
                    if (product.original_price) {
                        const formattedOriginalPrice = new Intl.NumberFormat('en-IN', {
                            style: 'currency',
                            currency: 'INR',
                            maximumFractionDigits: 0
                        }).format(product.original_price);
                        originalPriceHtml = `<div class="text-sm text-gray-500 line-through">${formattedOriginalPrice}</div>`;
                    }
                    
                    let discountHtml = '';
                    if (product.discount_percentage) {
                        discountHtml = `<span class="bg-red-100 text-red-800 text-xs font-semibold px-2 py-1 rounded">${product.discount_percentage}% OFF</span>`;
                    }
                    
                    let ratingHtml = '';
                    if (product.rating) {
                        ratingHtml = `
                            <div class="flex items-center mt-2">
                                <div class="text-yellow-400">
                                    ${'★'.repeat(Math.floor(product.rating))}${product.rating % 1 >= 0.5 ? '⯨' : '☆'}${'☆'.repeat(4 - Math.floor(product.rating))}
                                </div>
                                <span class="text-gray-600 text-sm ml-1">${product.rating}</span>
                            </div>
                        `;
                    }
                    
                    productCard.innerHTML = `
                        <div class="relative">
                            <img src="${product.image_url || 'https://via.placeholder.com/300x400?text=No+Image'}" 
                                 alt="${product.title}" 
                                 class="w-full h-48 object-cover">
                            <span class="${product.store_color} text-white text-xs font-semibold px-2 py-1 absolute top-2 left-2 rounded">${product.store_name}</span>
                            ${discountHtml ? `<span class="bg-red-500 text-white text-xs font-semibold px-2 py-1 absolute top-2 right-2 rounded">${discountHtml}</span>` : ''}
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-lg text-gray-800 truncate">${product.title}</h3>
                            <div class="flex items-center mt-1">
                                <div class="text-xl font-bold text-gray-900">${formattedPrice}</div>
                                ${originalPriceHtml}
                            </div>
                            ${ratingHtml}
                            <div class="mt-4 flex justify-between items-center">
                                <a href="${product.product_url}" target="_blank" class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                                    View Product
                                </a>
                                <span class="text-xs text-gray-500">${product.shipping_info || 'Free Shipping'}</span>
                            </div>
                        </div>
                    `;
                    
                    resultsGrid.appendChild(productCard);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('resultsGrid').innerHTML = `
                    <div class="col-span-full text-center py-8">
                        <i class="fas fa-exclamation-triangle text-yellow-500 text-4xl mb-4"></i>
                        <h3 class="text-lg font-semibold text-gray-800">Error loading results</h3>
                        <p class="text-gray-600">${error.message || 'Please try again later'}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
